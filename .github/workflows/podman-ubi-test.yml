# This is a basic workflow to help you get started with Actions

name: Podman Test 01

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# This is a basic workflow to help you get started with Actions

name: UBI-Test

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  # push:
  #   branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test-rhel:
    runs-on: self-hosted
    strategy:
      matrix:
        rhel: [ubi7, ubi9-9.2, ubi9-9.6]

    steps:
      - uses: actions/checkout@v4

      - name: Build & Test
        run: |
          case "${{ matrix.rhel }}" in
            ubi7)
              IMAGE="registry.access.redhat.com/ubi7/ubi"
              ;;
            ubi9-9.2)
              IMAGE="registry.access.redhat.com/ubi9/ubi:9.2"
              ;;
            ubi9-9.6)
              IMAGE="registry.access.redhat.com/ubi9/ubi:9.6"
              ;;
          esac

          podman run "$IMAGE" bash -c "echo Running tests on $IMAGE"
